name: Verify Kwin Studio

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static release gates
        run: node scripts/verify-site.mjs
