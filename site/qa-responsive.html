<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kwin Studio responsive QA</title><style>body{font:14px/1.45 Arial,sans-serif;margin:24px;background:#111;color:#eee}h1{font-size:24px}.summary{padding:14px;border:1px solid #444;margin:18px 0}.pass{color:#a9e99a}.fail{color:#ff786f}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #333;text-align:left;vertical-align:top}code{white-space:pre-wrap;word-break:break-word}</style></head><body><h1>Kwin Studio exact responsive QA</h1><p>Temporary same-origin harness. Each route is rendered inside an iframe at the exact requested CSS viewport width, then inspected from the parent document.</p><div id="summary" class="summary">Running…</div><table><thead><tr><th>Width</th><th>Route</th><th>Status</th><th>Observed</th></tr></thead><tbody id="rows"></tbody></table><script>(()=>{const widths=[320,375,390,430,768,1440];const routes=['/','/work/','/work/portal-v2/','/work/adaptive-brand-system/','/work/spatial-interface-study/','/services/','/studio/','/contact/','/privacy/','/404.html'];const rows=document.querySelector('#rows'),summary=document.querySelector('#summary');const results=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));const checkRect=(el,w)=>{const r=el.getBoundingClientRect();return !r.width||!r.height||(r.left>=-2&&r.right<=w+2)};async function test(width,route){const frame=document.createElement('iframe');frame.width=String(width);frame.height='900';frame.style.cssText='position:absolute;left:-100000px;top:0;border:0;';document.body.append(frame);const loaded=new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('load timeout')),8000);frame.onload=()=>{clearTimeout(t);resolve()}});frame.src=route;try{await loaded;await sleep(180);const win=frame.contentWindow,doc=frame.contentDocument;if(!win||!doc)throw new Error('no frame document');const observed=win.innerWidth;const failures=[];if(Math.abs(observed-width)>1)failures.push(`innerWidth ${observed} != ${width}`);const sw=Math.max(doc.documentElement.scrollWidth,doc.body?.scrollWidth||0);const cw=doc.documentElement.clientWidth;if(sw>cw+1)failures.push(`horizontal overflow ${sw}>${cw}`);if(!doc.querySelector('main'))failures.push('main missing');if((doc.querySelector('main')?.innerText||'').trim().length<40)failures.push('main nearly blank');const imgs=[...doc.images];const broken=imgs.filter(i=>i.complete&&i.naturalWidth===0);if(broken.length)failures.push(`${broken.length} broken image(s)`);const header=doc.querySelector('[data-site-header]');if(!header)failures.push('header missing');const trigger=doc.querySelector('[data-menu-trigger]'),menu=doc.querySelector('[data-mobile-menu]');if(width<=840){if(!trigger||getComputedStyle(trigger).display==='none')failures.push('mobile trigger hidden');else if(menu){trigger.click();await sleep(20);if(trigger.getAttribute('aria-expanded')!=='true'||menu.hidden)failures.push('mobile menu did not open');doc.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await sleep(20);if(trigger.getAttribute('aria-expanded')!=='false'||!menu.hidden)failures.push('Escape did not close menu');}else failures.push('mobile menu missing');}else{const nav=doc.querySelector('.primary-nav');if(!nav||getComputedStyle(nav).display==='none')failures.push('desktop nav hidden');}const hero=doc.querySelector('h1');if(hero&&!checkRect(hero,width))failures.push('H1 clips viewport');const visibleHeadings=[...doc.querySelectorAll('h1,h2,h3')].filter(el=>getComputedStyle(el).display!=='none');const clipped=visibleHeadings.filter(el=>!checkRect(el,width));if(clipped.length)failures.push(`${clipped.length} heading(s) clip viewport`);if(route==='/contact/'){const controls=[...doc.querySelectorAll('input,select,textarea,button')].filter(el=>getComputedStyle(el).display!=='none');const bad=controls.filter(el=>!checkRect(el,width));if(bad.length)failures.push(`${bad.length} form control(s) clip viewport`);}const footer=doc.querySelector('footer');if(footer&&!checkRect(footer,width))failures.push('footer clips viewport');return {width,route,observed,scrollWidth:sw,clientWidth:cw,failures};}catch(error){return {width,route,observed:null,failures:[String(error.message||error)]};}finally{frame.remove();}}async function run(){for(const width of widths){for(const route of routes){const r=await test(width,route);results.push(r);const tr=document.createElement('tr');const ok=!r.failures.length;tr.innerHTML=`<td>${width}px</td><td>${route}</td><td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td><td><code>${ok?`innerWidth=${r.observed}; scroll=${r.scrollWidth}/${r.clientWidth}`:r.failures.join(' | ')}</code></td>`;rows.append(tr);}}const failed=results.filter(r=>r.failures.length);summary.innerHTML=`<strong class="${failed.length?'fail':'pass'}">${failed.length?'FAIL':'PASS'}</strong> — ${results.length-failed.length}/${results.length} viewport-route checks passed.${failed.length?` ${failed.length} failed.`:' Exact mobile widths verified.'}`;window.__QA_RESULTS__=results;window.__QA_DONE__=true;}run();})();</script></body></html>
